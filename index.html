<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فرمول‌نامه فیزیک ⚡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']]
  },
  svg: {
    fontCache: 'global'
  }
};
</script>

<script
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

<style>

/* =====================================================
   THEME
===================================================== */

:root {
  --bg:#040811;
  --panel:#091322;
  --panel2:#0d1929;
  --border:#1b3048;
  --text:#f5f9ff;
  --muted:#8798ad;

  --blue:#00c8ff;
  --blue2:#007cf0;

  --green:#29e69a;
  --yellow:#ffd166;
  --red:#ff667d;

  --pink:#ff4fa3;
  --pink2:#ff8acb;
  --pinkGlow:rgba(255,79,163,.18);

  --shadow:0 20px 60px rgba(0,0,0,.35);
}

/* =====================================================
   GIRL THEME
===================================================== */

body.girl-theme {

  --bg:#10050d;
  --panel:#1b0b18;
  --panel2:#241025;
  --border:#542341;

  --text:#fff5fb;
  --muted:#c79bb6;

  --blue:#ff6fba;
  --blue2:#ff2f91;

  --pink:#ff4fa3;
  --pink2:#ff9bd4;

  background:
    radial-gradient(
      circle at 90% 0%,
      #55183e 0,
      transparent 32%
    ),
    radial-gradient(
      circle at 0% 100%,
      #3c1232 0,
      transparent 28%
    ),
    var(--bg);
}

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  min-height:100vh;

  font-family:"Vazirmatn",sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 90% 0%,
      #103353 0,
      transparent 32%
    ),
    radial-gradient(
      circle at 0% 100%,
      #06353e 0,
      transparent 28%
    ),
    var(--bg);

  transition:
    background .5s ease,
    color .3s ease;
}

button,
input,
select {
  font-family:inherit;
}

button {
  -webkit-tap-highlight-color:transparent;
}

.hidden {
  display:none!important;
}

/* =====================================================
   LOGIN
===================================================== */

.onboarding {

  position:fixed;
  inset:0;

  z-index:1000;

  display:grid;
  place-items:center;

  padding:18px;

  overflow:auto;

  background:
    radial-gradient(
      circle at 50% 0%,
      #102c48 0,
      transparent 45%
    ),
    #02050b;
}

.girl-theme .onboarding {

  background:
    radial-gradient(
      circle at 50% 0%,
      #571b40 0,
      transparent 45%
    ),
    #090207;
}

/* =====================================================
   LOGIN BOX
===================================================== */

.login-box {

  width:min(520px,100%);

  padding:30px;

  border:1px solid #20354d;
  border-radius:28px;

  background:rgba(8,17,30,.94);

  box-shadow:
    0 0 80px rgba(0,200,255,.08),
    var(--shadow);

  backdrop-filter:blur(20px);

  animation:
    loginAppear .55s ease;
}

.girl-theme .login-box {

  border-color:#613052;

  background:
    linear-gradient(
      145deg,
      rgba(31,10,27,.96),
      rgba(16,5,14,.96)
    );

  box-shadow:
    0 0 80px rgba(255,79,163,.13),
    var(--shadow);
}

@keyframes loginAppear {

  from {
    opacity:0;
    transform:translateY(20px) scale(.97);
  }

  to {
    opacity:1;
    transform:none;
  }

}

/* =====================================================
   LOGO
===================================================== */

.logo {

  width:78px;
  height:78px;

  margin:0 auto 14px;

  display:grid;
  place-items:center;

  border-radius:24px;

  font-size:42px;

  background:
    linear-gradient(
      135deg,
      #006de0,
      #00c8ff
    );

  box-shadow:
    0 0 35px rgba(0,200,255,.25);

  transition:.4s;
}

.girl-theme .logo {

  background:
    linear-gradient(
      135deg,
      #ff2f91,
      #ff8acb
    );

  box-shadow:
    0 0 35px rgba(255,79,163,.35);
}

/* =====================================================
   LOGIN TEXT
===================================================== */

.login-title {

  margin:0;

  text-align:center;

  font-size:27px;
}

.login-sub {

  margin:8px 0 24px;

  text-align:center;

  color:var(--muted);
}

/* =====================================================
   STEP INDICATOR
===================================================== */

.steps {

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  margin:0 0 22px;
}

.step {

  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  border:1px solid var(--border);

  border-radius:50%;

  color:var(--muted);

  background:#07111f;

  font-size:13px;

  font-weight:800;

  transition:.3s;
}

.step.active {

  color:white;

  border-color:var(--blue);

  background:
    linear-gradient(
      135deg,
      var(--blue2),
      var(--blue)
    );

  box-shadow:
    0 0 20px rgba(0,200,255,.25);
}

.girl-theme .step.active {

  background:
    linear-gradient(
      135deg,
      #ff2f91,
      #ff8acb
    );

  box-shadow:
    0 0 20px rgba(255,79,163,.3);
}

.step-line {

  width:45px;
  height:2px;

  background:var(--border);

  border-radius:5px;
}

/* =====================================================
   VPN
===================================================== */

.vpn {

  margin-bottom:18px;

  padding:13px;

  border:1px solid #806000;
  border-radius:14px;

  color:#ffd66d;

  background:rgba(128,96,0,.12);

  text-align:center;

  font-size:13px;
}

/* =====================================================
   FIELDS
===================================================== */

.field {
  margin:13px 0;
}

.field label {

  display:block;

  margin-bottom:7px;

  color:#b7c7d9;

  font-size:14px;
}

input,
select {

  width:100%;

  min-height:48px;

  padding:12px 14px;

  border:1px solid #263b54;

  border-radius:13px;

  outline:none;

  color:white;

  background:#060d18;

  transition:.2s;
}

.girl-theme input,
.girl-theme select {

  border-color:#59304a;

  background:#120710;
}

input:focus,
select:focus {

  border-color:var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(0,200,255,.08);
}

.girl-theme input:focus,
.girl-theme select:focus {

  box-shadow:
    0 0 0 3px
    rgba(255,79,163,.10);
}

/* =====================================================
   GENDER
===================================================== */

.gender-grid {

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;
}

.gender-option {

  position:relative;
}

.gender-option input {

  position:absolute;

  opacity:0;

  pointer-events:none;
}

.gender-label {

  min-height:58px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  border:1px solid #263b54;

  border-radius:14px;

  color:#aebed0;

  background:#060d18;

  cursor:pointer;

  transition:.25s;

  font-weight:700;
}

.gender-label:hover {

  border-color:var(--blue);
}

.gender-option input:checked + .gender-label {

  color:white;

  border-color:var(--blue);

  background:
    rgba(0,200,255,.10);

  box-shadow:
    0 0 20px rgba(0,200,255,.08);
}

/* =====================================================
   BUTTONS
===================================================== */

.main-btn {

  width:100%;

  min-height:50px;

  margin-top:9px;

  border:0;

  border-radius:14px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--blue2),
      var(--blue)
    );

  font-size:15px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 8px 25px
    rgba(0,150,255,.18);

  transition:.25s;
}

.main-btn:hover {

  transform:translateY(-2px);
}

.main-btn:disabled {

  opacity:.55;

  cursor:not-allowed;

  transform:none;
}

.secondary-btn {

  width:100%;

  min-height:48px;

  margin-top:9px;

  border:1px solid var(--border);

  border-radius:14px;

  color:#c9d6e5;

  background:#091321;

  cursor:pointer;

  font-weight:700;
}

.status {

  min-height:22px;

  margin-top:12px;

  text-align:center;

  font-size:13px;
}

/* =====================================================
   APP
===================================================== */

.app {
  display:none;
}

header {

  position:sticky;

  top:0;

  z-index:100;

  border-bottom:
    1px solid rgba(30,48,72,.8);

  background:
    rgba(4,8,17,.82);

  backdrop-filter:blur(18px);
}

.girl-theme header {

  border-bottom-color:#4b213b;

  background:
    rgba(16,5,13,.84);
}

.header-inner {

  max-width:1150px;

  margin:auto;

  padding:13px 18px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;
}

.brand {

  display:flex;

  align-items:center;

  gap:9px;

  font-weight:800;
}

.brand-icon {
  font-size:24px;
}

.user-area {

  display:flex;

  align-items:center;

  gap:10px;
}

.user-name {

  color:var(--blue);

  font-size:13px;
}

.small-btn {

  border:1px solid var(--border);

  border-radius:10px;

  padding:8px 11px;

  color:#c9d6e5;

  background:#0b1524;

  cursor:pointer;

  transition:.2s;
}

.small-btn:hover {

  border-color:var(--blue);

  color:white;
}

/* =====================================================
   MAIN
===================================================== */

main {

  max-width:1150px;

  margin:auto;

  padding:25px 18px 40px;
}

/* =====================================================
   HERO
===================================================== */

.hero {

  position:relative;

  overflow:hidden;

  padding:32px 20px;

  margin-bottom:20px;

  border:1px solid var(--border);

  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      rgba(0,124,240,.12),
      rgba(0,200,255,.03)
    ),
    var(--panel);
}

.girl-theme .hero {

  background:
    linear-gradient(
      135deg,
      rgba(255,47,145,.13),
      rgba(255,138,203,.03)
    ),
    var(--panel);
}

.hero:after {

  content:"";

  position:absolute;

  width:180px;
  height:180px;

  left:-70px;
  top:-80px;

  border-radius:50%;

  background:
    rgba(0,200,255,.08);

  filter:blur(10px);
}

.girl-theme .hero:after {

  background:
    rgba(255,79,163,.10);
}

.hero h1 {

  position:relative;

  z-index:1;

  margin:0 0 8px;

  font-size:
    clamp(28px,6vw,46px);
}

.hero p {

  position:relative;

  z-index:1;

  margin:0;

  color:var(--muted);
}

.stats {

  position:relative;

  z-index:1;

  display:flex;

  flex-wrap:wrap;

  gap:9px;

  margin-top:18px;
}

.stat {

  padding:8px 12px;

  border:1px solid var(--border);

  border-radius:10px;

  color:#cbd8e7;

  background:#07111f;

  font-size:12px;
}

/* =====================================================
   CONTROLS
===================================================== */

.controls {

  display:grid;

  grid-template-columns:1fr 230px;

  gap:10px;

  margin-bottom:16px;
}

.search-wrap {
  position:relative;
}

.search-wrap span {

  position:absolute;

  top:50%;
  right:14px;

  transform:translateY(-50%);

  pointer-events:none;
}

.search-wrap input {

  padding-right:43px;
}

/* =====================================================
   GRID
===================================================== */

.grid {

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(250px,1fr)
    );

  gap:14px;
}

.card {

  position:relative;

  overflow:hidden;

  min-height:185px;

  padding:20px;

  border:1px solid var(--border);

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      #0a1524,
      #08111d
    );

  cursor:pointer;

  transition:.2s;
}

.girl-theme .card {

  background:
    linear-gradient(
      145deg,
      #21101e,
      #120912
    );
}

.card:hover {

  transform:translateY(-4px);

  border-color:var(--blue);

  box-shadow:
    0 15px 35px
    rgba(0,180,255,.08);
}

.girl-theme .card:hover {

  box-shadow:
    0 15px 35px
    rgba(255,79,163,.10);
}

.card-top {

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.chapter-num {

  color:var(--blue);

  font-size:12px;

  font-weight:700;
}

.star {

  border:0;

  background:none;

  color:#516277;

  font-size:22px;

  cursor:pointer;
}

.star.active {

  color:var(--yellow);
}

.card h3 {

  margin:13px 0 7px;

  font-size:19px;
}

.card p {

  min-height:48px;

  margin:0;

  color:var(--muted);

  font-size:13px;

  line-height:1.9;
}

.card-footer {

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-top:17px;

  color:var(--blue);

  font-size:12px;
}

.empty {

  padding:45px 20px;

  border:1px dashed #29405a;

  border-radius:18px;

  color:var(--muted);

  text-align:center;
}

/* =====================================================
   FOOTER
===================================================== */

.site-footer {

  padding:28px 18px 35px;

  text-align:center;

  color:var(--muted);

  font-size:13px;
}

.site-footer span {

  color:var(--blue);

  font-weight:700;
}

/* =====================================================
   MODAL
===================================================== */

.modal {

  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  padding:18px;

  overflow:auto;

  background:
    rgba(0,0,0,.78);

  backdrop-filter:blur(8px);
}

.modal-box {

  width:min(850px,100%);

  margin:20px auto;

  padding:22px;

  border:1px solid #263b55;

  border-radius:22px;

  background:#08111e;

  box-shadow:var(--shadow);
}

.girl-theme .modal-box {

  border-color:#54233f;

  background:#120812;
}

.modal-head {

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;
}

.modal-head h2 {

  margin:0;

  font-size:20px;
}

.close {

  width:40px;
  height:40px;

  border:0;

  border-radius:10px;

  color:white;

  background:#152235;

  font-size:22px;

  cursor:pointer;
}

.formula {

  margin:11px 0;

  padding:16px;

  border:1px solid #1c334d;

  border-radius:15px;

  background:#0c1827;
}

.girl-theme .formula {

  border-color:#472239;

  background:#1a0c18;
}

.formula-title {

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  color:var(--blue);

  font-weight:700;
}

.copy-btn {

  padding:7px 10px;

  border:1px solid #263d57;

  border-radius:8px;

  color:#b9c8d9;

  background:#091321;

  cursor:pointer;

  font-size:11px;
}

.equation {

  padding:12px 4px 5px;

  direction:ltr;

  text-align:center;

  overflow-x:auto;

  font-size:21px;
}

/* =====================================================
   TOAST
===================================================== */

.toast {

  position:fixed;

  right:18px;

  bottom:18px;

  z-index:1000;

  max-width:330px;

  padding:12px 15px;

  border:1px solid #24415e;

  border-radius:12px;

  background:#0a1726;

  color:white;

  box-shadow:var(--shadow);

  transform:translateY(120px);

  opacity:0;

  transition:.25s;
}

.toast.show {

  transform:translateY(0);

  opacity:1;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px) {

  .login-box {
    padding:22px;
  }

  .controls {
    grid-template-columns:1fr;
  }

  .header-inner {
    padding:12px;
  }

  .user-name {
    display:none;
  }

  main {
    padding:18px 12px 20px;
  }

  .hero {
    padding:25px 17px;
  }

  .grid {
    grid-template-columns:1fr;
  }

  .gender-grid {
    grid-template-columns:1fr 1fr;
  }

}

/* =====================================================
   STEP PAGES
===================================================== */

.step-page {
  display:none;
}

.step-page.active {
  display:block;
}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section
  class="onboarding"
  id="onboarding"
>

  <div class="login-box">

    <div class="logo" id="loginLogo">
      ⚡
    </div>

    <h1 class="login-title">
      فرمول‌نامه فیزیک
    </h1>

    <p class="login-sub">
      فرمول‌های فیزیک دبیرستان، مرتب و سریع
    </p>


    <!-- مراحل -->

    <div class="steps">

      <div
        class="step active"
        id="stepIndicator1"
      >
        ۱
      </div>

      <div class="step-line"></div>

      <div
        class="step"
        id="stepIndicator2"
      >
        ۲
      </div>

    </div>


    <!-- VPN -->

    <div class="vpn">
      🔐 لطفاً فیلترشکن یا VPN خود را روشن کنید.
    </div>


    <!-- =================================================
         STEP 1
    ================================================= -->

    <div
      class="step-page active"
      id="step1"
    >

      <div class="field">

        <label>
          نام و نام خانوادگی
        </label>

        <input
          id="fullName"
          type="text"
          placeholder="مثلاً علی احمدی"
          autocomplete="name"
        >

      </div>


      <div class="field">

        <label>
          شماره موبایل
        </label>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          placeholder="09xxxxxxxxx"
          autocomplete="tel"
        >

      </div>


      <div class="field">

        <label>
          جنسیت
        </label>

        <div class="gender-grid">

          <div class="gender-option">

            <input
              type="radio"
              name="gender"
              id="genderBoy"
              value="پسر"
              onchange="previewTheme('پسر')"
            >

            <label
              class="gender-label"
              for="genderBoy"
            >
              💙 پسر
            </label>

          </div>


          <div class="gender-option">

            <input
              type="radio"
              name="gender"
              id="genderGirl"
              value="دختر"
              onchange="previewTheme('دختر')"
            >

            <label
              class="gender-label"
              for="genderGirl"
            >
              💗 دختر
            </label>

          </div>

        </div>

      </div>


      <button
        class="main-btn"
        onclick="nextStep()"
      >
        ادامه ←
      </button>

    </div>


    <!-- =================================================
         STEP 2
    ================================================= -->

    <div
      class="step-page"
      id="step2"
    >

      <div class="field">

        <label>
          پایه تحصیلی
        </label>

        <select id="grade">

          <option value="">
            انتخاب پایه
          </option>

          <option value="دهم">
            دهم
          </option>

          <option value="یازدهم">
            یازدهم
          </option>

          <option value="دوازدهم">
            دوازدهم
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          رشته
        </label>

        <select id="major">

          <option value="">
            انتخاب رشته
          </option>

          <option value="ریاضی">
            ریاضی
          </option>

          <option value="تجربی">
            تجربی
          </option>

        </select>

      </div>


      <button
        class="main-btn"
        id="enter"
        onclick="saveUser()"
      >
        ورود به فرمول‌نامه ⚡
      </button>


      <button
        class="secondary-btn"
        onclick="previousStep()"
      >
        → برگشت
      </button>

    </div>


    <div
      class="status"
      id="status"
    ></div>

  </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<div
  class="app"
  id="app"
>

<header>

  <div class="header-inner">

    <div class="brand">

      <span class="brand-icon">
        ⚡
      </span>

      <span>
        فرمول‌نامه فیزیک
      </span>

    </div>


    <div class="user-area">

      <span
        class="user-name"
        id="user"
      ></span>

      <button
        class="small-btn"
        onclick="resetUser()"
      >
        خروج
      </button>

    </div>

  </div>

</header>


<main>

  <section class="hero">

    <h1>

function getUser() {

  try {

      localStorage.getItem("physicsUser")
    );

  } catch {

    return null;

  }

}


/* =====================================================

===================================================== */

function applyTheme(gender) {

  document.body.classList.remove(
    "girl-theme"
  );

  if (gender === "دختر") {

    document.body.classList.add(
      "girl-theme"
    );

  }

}


function previewTheme(gender) {

  applyTheme(gender);

}

   TOAST
===================================================== */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  },2200);

}


/* =====================================================
   FAVORITES
===================================================== */

function getFavorites() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "physicsFavorites"
      )
    ) || [];

  } catch {

    return [];

  }

}


function setFavorites(list) {

  localStorage.setItem(
    "physicsFavorites",
    JSON.stringify(list)
  );

}


function favoriteKey(
  grade,
  major,
  index
) {

  return `${grade}|${major}|${index}`;

}


function isFavorite(
  grade,
  major,
  index
) {

  return getFavorites().includes(
    favoriteKey(
      grade,
      major,
      index
    )
  );

}


/* =====================================================
   STEP 1 → STEP 2
===================================================== */

function nextStep() {

  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const gender =
    document.querySelector(
      'input[name="gender"]:checked'
    );


  if (!fullName) {

    setStatus(
      "⚠️ نام و نام خانوادگی را وارد کن.",
      "#ffd166"
    );

    return;

  }


  if (!phone) {

    setStatus(
      "⚠️ شماره موبایل را وارد کن.",
      "#ffd166"
    );

    return;

  }


  if (!/^09\d{9}$/.test(phone)) {

    setStatus(
      "⚠️ شماره موبایل باید مثل 09123456789 باشد.",
      "#ffd166"
    );

    return;

  }


  if (!gender) {

    setStatus(
      "⚠️ جنسیت را انتخاب کن.",
      "#ffd166"
    );

    return;

  }


  setStatus(
    "",
    ""
  );


  document
    .getElementById("step1")
    .classList.remove("active");

  document
    .getElementById("step2")
    .classList.add("active");


  document
    .getElementById("stepIndicator1")
    .classList.remove("active");

  document
    .getElementById("stepIndicator2")
    .classList.add("active");

}


/* =====================================================
   STEP 2 → STEP 1
===================================================== */

function previousStep() {

  document
    .getElementById("step2")
    .classList.remove("active");

  document
    .getElementById("step1")
    .classList.add("active");


  document
    .getElementById("stepIndicator2")
    .classList.remove("active");

  document
    .getElementById("stepIndicator1")
    .classList.add("active");


  setStatus(
    "",
    ""
  );

}


/* =====================================================
   SAVE USER
===================================================== */

async function saveUser() {

  const genderElement =
    document.querySelector(
      'input[name="gender"]:checked'
    );


  const user = {

    fullName:
      document
        .getElementById("fullName")
        .value
        .trim(),

    phone:
      document
        .getElementById("phone")
        .value
        .trim(),

    gender:
      genderElement
        ? genderElement.value
        : "",

    grade:
      document
        .getElementById("grade")
        .value,

    major:
      document
        .getElementById("major")
        .value

  };


  if (
    !user.fullName ||
    !user.phone ||
    !user.gender ||
    !user.grade ||
    !user.major
  ) {

    setStatus(
      "⚠️ لطفاً همه اطلاعات را کامل کن.",
      "#ffd166"
    );

    return;

  }


  const button =
    document.getElementById("enter");


  button.disabled = true;

  button.textContent =
    "در حال ورود...";


  /*
    فعلاً اطلاعات در مرورگر ذخیره می‌شود.
  */

  localStorage.setItem(
    "physicsUser",
    JSON.stringify(user)
  );


  applyTheme(
    user.gender
  );


  try {

    const response =
      await fetch(
        API_URL +
        "/api/send-telegram",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(user)

        }
      );


    if (!response.ok) {

      throw new Error(
        "Server error"
      );

    }


    setStatus(
      "✅ اطلاعات با موفقیت ثبت شد.",
      "#29e69a"
    );


  } catch {

    setStatus(
      "⚠️ ارتباط با سرور برقرار نشد؛ ورود ادامه پیدا می‌کند.",
      "#ffd166"
    );

  }


  setTimeout(() => {

    openApp(user);

    button.disabled = false;

    button.textContent =
      "ورود به فرمول‌نامه ⚡";

  },700);

}


/* =====================================================
   OPEN APP
===================================================== */

function openApp(user) {

  applyTheme(
    user.gender
  );


  document
    .getElementById("onboarding")
    .style.display = "none";


  document
    .getElementById("app")
    .style.display = "block";


  document
    .getElementById("user")
    .textContent =
      "سلام " +
      user.fullName +
      " 👋";


  document
    .getElementById("info")
    .textContent =
      `${user.grade} ${user.major}`;


  render();

}


/* =====================================================
   RENDER
===================================================== */

function render() {

  const user =
    getUser();


  if (!user) return;


  const data =
    DATA[user.grade]?.[user.major] || [];


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const filter =
    document.getElementById(
      "filter"
    );


  const oldValue =
    filter.value;


  filter.innerHTML =
    `<option value="all">
      همه فصل‌ها
    </option>`;


  data.forEach(
    (chapter,index) => {

      filter.innerHTML += `
        <option value="${index}">
          فصل ${index + 1}: ${chapter[0]}
        </option>
      `;

    }
  );


  if (
    [...filter.options].some(
      option =>
        option.value === oldValue
    )
  ) {

    filter.value =
      oldValue;

  }


  let list =
    data.map(
      (chapter,index) => ({
        chapter,
        index
      })
    );


  if (
    filter.value !== "all"
  ) {

    list =
      list.filter(
        item =>
          String(item.index) ===
          filter.value
      );

  }


  if (search) {

    list =
      list.filter(
        item => {

          const chapter =
            item.chapter;


          const searchable =
            [
              chapter[0],
              chapter[1],

              ...chapter[2]
                .map(
                  formula =>
                    formula[0]
                )

            ]
            .join(" ")
            .toLowerCase();


          return searchable.includes(
            search
          );

        }
      );

  }


  const container =
    document.getElementById(
      "chapters"
    );


  if (!list.length) {

    container.innerHTML = `
      <div class="empty">
        🔎 فرمولی مطابق جستجوی شما پیدا نشد.
      </div>
    `;

    updateStats(data);

    return;

  }


  container.innerHTML =
    list.map(
      item => {

        const chapter =
          item.chapter;


        const favorite =
          isFavorite(
            user.grade,
            user.major,
            item.index
          );


        return `

          <article
            class="card"
            onclick="openChapter(${item.index})"
          >

            <div class="card-top">

              <div class="chapter-num">
                فصل ${item.index + 1}
              </div>


              <button
                class="star ${
                  favorite
                    ? "active"
                    : ""
                }"
                onclick="
                  toggleFavorite(
                    event,
                    ${item.index}
                  )
                "
                aria-label="علاقه‌مندی"
              >
                ${
                  favorite
                    ? "★"
                    : "☆"
                }
              </button>

            </div>


            <h3>
              ${chapter[0]}
            </h3>


            <p>
              ${chapter[1]}
            </p>


            <div class="card-footer">

              <span>
                ${chapter[2].length}
                فرمول
              </span>

              <span>
                مشاهده ←
              </span>

            </div>

          </article>

        `;

      }
    )
    .join("");


  updateStats(data);

}


/* =====================================================
   STATS
===================================================== */

function updateStats(data) {

  const formulaCount =
    data.reduce(
      (sum,chapter) =>
        sum +
        chapter[2].length,
      0
    );


  document
    .getElementById(
      "chapterCount"
    )
    .textContent =
      data.length;


  document
    .getElementById(
      "formulaCount"
    )
    .textContent =
      formulaCount;


  document
    .getElementById(
      "favoriteCount"
    )
    .textContent =
      getFavorites().length;

}


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(
  event,
  index
) {

  event.stopPropagation();


  const user =
    getUser();


  if (!user) return;


  const key =
    favoriteKey(
      user.grade,
      user.major,
      index
    );


  let list =
    getFavorites();


  if (
    list.includes(key)
  ) {

    list =
      list.filter(
        item =>
          item !== key
      );

    showToast(
      "از علاقه‌مندی‌ها حذف شد"
    );

  } else {

    list.push(key);

    showToast(
      "⭐ به علاقه‌مندی‌ها اضافه شد"
    );

  }


  setFavorites(list);

  render();

}


/* =====================================================
   OPEN CHAPTER
===================================================== */

function openChapter(index) {

  const user =
    getUser();


  if (!user) return;


  const chapter =
    DATA[
      user.grade
    ][
      user.major
    ][index];


  document
    .getElementById("mt")
    .textContent =
      `فصل ${index + 1}: ${chapter[0]}`;


  document
    .getElementById("formulas")
    .innerHTML =

      chapter[2]
        .map(
          formula => {

            const encoded =
              encodeURIComponent(
                formula[0] +
                " = " +
                formula[1]
              );


            return `

              <div class="formula">

                <div class="formula-title">

                  <span>
                    ${formula[0]}
                  </span>


                  <button
                    class="copy-btn"
                    onclick="
                      copyFormula(
                        '${encoded}'
                      )
                    "
                  >
                    📋 کپی
                  </button>

                </div>


                <div class="equation">
                  ${formula[1]}
                </div>

              </div>

            `;

          }
        )
        .join("");


  document
    .getElementById("modal")
    .style.display =
      "block";


  if (
    window.MathJax
  ) {

    MathJax.typesetPromise();

  }

}


/* =====================================================
   COPY
===================================================== */

async function copyFormula(
  encoded
) {

  const text =
    decodeURIComponent(
      encoded
    );


  try {

    await navigator
      .clipboard
      .writeText(text);

    showToast(
      "📋 کپی شد"
    );

  } catch {

    showToast(
      "کپی انجام نشد"
    );

  }

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

  document
    .getElementById("modal")
    .style.display =
      "none";

}


document
  .getElementById("modal")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "modal"
      ) {

        closeModal();

      }

    }
  );


/* =====================================================
   LOGOUT
===================================================== */

function resetUser() {

  if (
    !confirm(
      "با خروج، اطلاعات ذخیره‌شده و علاقه‌مندی‌ها پاک می‌شوند. ادامه می‌دهی؟"
    )
  ) return;


  localStorage.removeItem(
    "physicsUser"
  );


  localStorage.removeItem(
    "physicsFavorites"
  );


  document
    .getElementById("app")
    .style.display =
      "none";


  document
    .getElementById("onboarding")
    .style.display =
      "grid";


  document
    .getElementById("step1")
    .classList.add("active");


  document
    .getElementById("step2")
    .classList.remove("active");


  document
    .getElementById("stepIndicator1")
    .classList.add("active");


  document
    .getElementById("stepIndicator2")
    .classList.remove("active");


  document
    .getElementById("fullName")
    .value = "";


  document
    .getElementById("phone")
    .value = "";


  document
    .getElementById("grade")
    .value = "";


  document
    .getElementById("major")
    .value = "";


  document
    .querySelectorAll(
      'input[name="gender"]'
    )
    .forEach(
      radio =>
        radio.checked = false
    );


  document.body.classList.remove(
    "girl-theme"
  );


  setStatus(
    "",
    ""
  );

}


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    const user =
      getUser();


    if (!user) {

      document
        .getElementById("onboarding")
        .style.display =
          "grid";

      return;

    }


    /*
      اگر کاربر قبلاً ثبت‌نام کرده باشد،
      مستقیم وارد سایت می‌شود.
    */

    applyTheme(
      user.gender
    );


    openApp(user);

  }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeModal();

    }

  }
);

</script>
